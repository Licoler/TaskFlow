<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TaskFlow — Modern Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/todomvc-common-base.css">
  <link rel="stylesheet" href="lib/todomvc-app.css">
</head>
<body>
  <canvas id="canvas-bg"></canvas>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <script src="lib/elmish.js"></script>
  <script src="lib/todo-app.js"></script>
  <script src="lib/taskflow-api.js"></script>
  <script>
    (function initCanvas() {
      const canvas = document.getElementById('canvas-bg');
      if (!canvas) return;
      let ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const symbols = ['✨', '⌨️', '⚡', '✧', '⟡', '●', '◯', '✶', '☄', '💻', '🖱️', '❄️', '🌀', '⎋', '⌘', '⭐'];
      let mouseX = 0, mouseY = 0;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initParticles();
      }

      function initParticles() {
        particles = [];
        const count = Math.min(200, Math.floor(width * height / 7000));
        for (let i = 0; i < count; i++) {
          particles.push({
            baseX: Math.random() * width,
            baseY: Math.random() * height,
            symbol: symbols[Math.floor(Math.random() * symbols.length)],
            size: 14 + Math.random() * 24,
          });
        }
      }

      function animate() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
        ctx.fillRect(0, 0, width, height);
        for (let p of particles) {
          let dx = mouseX - p.baseX;
          let dy = mouseY - p.baseY;
          let dist = Math.hypot(dx, dy);
          let maxDist = 250;
          let offsetX = 0, offsetY = 0;
          if (dist < maxDist) {
            let force = (1 - dist / maxDist) * 40;
            let angle = Math.atan2(dy, dx);
            offsetX = Math.cos(angle) * force;
            offsetY = Math.sin(angle) * force;
          }
          let x = p.baseX + offsetX;
          let y = p.baseY + offsetY;
          ctx.font = `${p.size}px "SF Mono", monospace`;
          ctx.fillStyle = `rgba(139, 92, 246, ${0.2 + (dist < maxDist ? 0.2 : 0.05)})`;
          ctx.fillText(p.symbol, x, y);
        }
        requestAnimationFrame(animate);
      }

      function handleMove(e) {
        if (e.touches) {
          mouseX = e.touches[0].clientX;
          mouseY = e.touches[0].clientY;
        } else {
          mouseX = e.clientX;
          mouseY = e.clientY;
        }
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('touchmove', handleMove);
      resize();
      animate();
    })();

    const model = { todos: [], hash: '#/', categoryFilter: 'all' };
    mountTaskFlow(model, 'app');
  </script>
  <div id="test-app"></div>
</body>
</html>
